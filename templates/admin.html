<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { display: block; width: 300px; padding: 15px; margin: 10px 0; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin Control Panel</h1>
    <input type="password" id="pw" placeholder="Admin Passwort"><br><br>
    
    <h3>Steuerung:</h3>
    <button onclick="setPhase('START')">1. Event starten (Wartebildschirm)</button>
    <button onclick="setPhase('RUNDE_1_TIPP')">2. Tipprunde 1 öffnen</button>
    <button onclick="setPhase('RUNDE_1_SIM')">3. Tipps sperren & Simulation anzeigen</button>
    
    <p id="result"></p>

    <script>
        async function setPhase(phase) {
            const pw = document.getElementById('pw').value;
            const res = await fetch('/api/admin/set-phase', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pw, phase: phase})
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.success ? "Erfolg: " + data.phase : data.error;
        }
    </script>
</body>
</html>
