<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5em;
            color: #667eea;
            margin-bottom: 10px;
            animation: fadeIn 0.8s ease-in;
        }
        
        .phase-badge {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .counter {
            font-size: 2.5em;
            color: #333;
            margin: 20px 0;
        }
        
        .counter-label {
            font-size: 1.2em;
            color: #666;
        }
        
        .counter-number {
            font-weight: bold;
            color: #667eea;
            font-size: 3em;
        }
        
        #wordcloud {
            min-height: 400px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            margin: 30px 0;
        }
        
        .word-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            animation: slideIn 0.5s ease-out;
            cursor: default;
            transition: all 0.3s ease;
        }
        
        .word-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .loading-text {
            font-size: 1.5em;
            color: #999;
            padding: 40px;
        }
        
        .emoji {
            font-size: 1.2em;
            margin-right: 5px;
        }
        
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 WM Tippspiel Dashboard</h1>
        
        <div class="phase-badge" id="phase-display">Lade...</div>
        
        <div id="nickname-phase-container" style="display: none;">
            <div class="counter">
                <div class="counter-label">Spieler angemeldet:</div>
                <div class="counter-number" id="participant-count">0</div>
            </div>
            
            <h2 style="color: #666; margin: 30px 0 20px;">Aktive Spieler</h2>
            <div id="wordcloud">
                <div class="loading-text">⏳ Warte auf erste Anmeldung...</div>
            </div>
        </div>
        
        <div id="other-phase-container" style="display: none;">
            <div class="loading-text" id="other-phase-text">
                📺 Simulation läuft...
            </div>
        </div>
        
        <div class="footer">
            Live Dashboard • Automatische Updates alle 2 Sekunden
        </div>
    </div>

    <script>
        let currentPhase = "";
        let displayedParticipants = new Set();
        
        async function updateDashboard() {
            try {
                // Get current phase
                const phaseRes = await fetch('/api/state');
                const phaseData = await phaseRes.json();
                
                // Update phase display
                updatePhaseDisplay(phaseData.phase);
                
                // If in nickname phase, show participants
                if (phaseData.phase === "RUNDE_1_NICKNAME") {
                    document.getElementById('nickname-phase-container').style.display = 'block';
                    document.getElementById('other-phase-container').style.display = 'none';
                    
                    const participantsRes = await fetch('/api/participants');
                    const participantsData = await participantsRes.json();
                    
                    updateWordCloud(participantsData.participants);
                    document.getElementById('participant-count').innerText = participantsData.count;
                } else {
                    document.getElementById('nickname-phase-container').style.display = 'none';
                    document.getElementById('other-phase-container').style.display = 'block';
                    document.getElementById('other-phase-text').innerText = `📺 Phase: ${phaseData.phase.replace(/_/g, ' ')}`;
                }
            } catch (e) {
                console.error("Error updating dashboard:", e);
            }
        }
        
        function updatePhaseDisplay(phase) {
            const phaseNames = {
                'START': '🎬 START',
                'RUNDE_1_NICKNAME': '✍️ NICKNAME PHASE',
                'RUNDE_1_GRUPPEN_TIPP': '🎯 GRUPPEN TIPPS',
                'RUNDE_1_SIM': '⚽ SIMULATION',
                'RUNDE_2_TIPP': '🎯 RUNDE 2',
                'FINALE_TIPP': '🏆 FINALE',
                'ENDE': '✅ ENDE'
            };
            document.querySelector('.phase-badge').innerText = phaseNames[phase] || phase;
        }
        
        function updateWordCloud(participants) {
            const wordcloud = document.getElementById('wordcloud');
            
            // If no participants, show loading message
            if (!participants || participants.length === 0) {
                wordcloud.innerHTML = '<div class="loading-text">⏳ Warte auf erste Anmeldung...</div>';
                return;
            }
            
            // Add new participants with animation
            participants.forEach(p => {
                if (!displayedParticipants.has(p.nickname)) {
                    displayedParticipants.add(p.nickname);
                    
                    // Remove loading message if it exists
                    const loadingMsg = wordcloud.querySelector('.loading-text');
                    if (loadingMsg) loadingMsg.remove();
                    
                    const badge = document.createElement('div');
                    badge.className = 'word-badge';
                    
                    // Randomize colors slightly for visual variety
                    const colors = [
                        'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                        'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                        'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
                    ];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    badge.style.background = randomColor;
                    
                    badge.innerText = p.nickname;
                    wordcloud.appendChild(badge);
                }
            });
        }
        
        // Initial update
        updateDashboard();
        
        // Poll every 2 seconds
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
