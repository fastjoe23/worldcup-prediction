<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM 2026 - Siegerehrung</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
    <style>
        .podium-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 50vh;
            margin-top: 40px;
            width: 100%;
        }
        
        .podium-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: riseUp 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .podium-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
            height: 100%;
            width: 250px;
            z-index: 3;
            animation-delay: 1.5s;
        }

        .podium-2 {
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            height: 75%;
            width: 220px;
            z-index: 2;
            animation-delay: 1s;
        }

        .podium-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%);
            height: 50%;
            width: 200px;
            z-index: 1;
            animation-delay: 0s;
        }

        .winner-name {
            font-size: 2em;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            word-break: break-word;
        }

        .winner-score {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            background: rgba(255,255,255,0.4);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .rank-number {
            font-size: 4em;
            font-weight: 900;
            color: rgba(0,0,0,0.1);
            margin-top: 20px;
            line-height: 1;
        }

        @keyframes riseUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            opacity: 0;
        }
    </style>
</head>
<body class="phase-finale" style="overflow: hidden;">
    <!-- Header mit Logos -->
    <header class="dashboard-header">
        <div class="logo-left">
            <img src="/static/DHBW_d_S_46mm_4c-1920w.webp" alt="DHBW Logo" class="header-logo">
        </div>
        <div class="round-display">SIEGEREHRUNG</div>
        <div class="logo-right">
            <img src="/static/vers_logo.png" alt="VersLeipzig Logo" class="header-logo">
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="main-content" style="flex-direction: column; justify-content: center; padding-top: 40px;">
        <h1 class="stage-title" style="font-size: 4em; margin-bottom: 20px;">Endstand</h1>
        
        <div class="podium-wrapper" id="podium-wrapper">
            <!-- Wird per JS befüllt -->
            <h2 style="color: #666;">Lade Ergebnisse...</h2>
        </div>
    </div>

    <!-- Sponsoren-Banner (unten) -->
    <footer class="sponsors-banner">
        <span class="sponsor-text">Partner:</span>
        <img src="/static/adesso_basic_Color_RGB-71eb02c9-1920w.png" alt="Sponsor 1" class="sponsor-logo">
        <img src="/static/logo_msg_RGB-1920w.jpg" alt="Sponsor 2" class="sponsor-logo">
        <img src="/static/viadico_logo-4fb06a49-1920w.png" alt="Sponsor 3" class="sponsor-logo">
    </footer>

    <script>
        async function loadFinalResults() {
            try {
                const res = await fetch('/api/participants');
                const data = await res.json();
                const participants = data.participants || [];
                
                const wrapper = document.getElementById('podium-wrapper');
                
                if (participants.length === 0) {
                    wrapper.innerHTML = "<h2>Keine Teilnehmer gefunden.</h2>";
                    return;
                }

                // Wir brauchen mindestens 3 leere Objekte, falls weniger als 3 Leute mitgespielt haben
                const top3 = [
                    participants[0] || { nickname: "N/A", score: 0 },
                    participants[1] || { nickname: "N/A", score: 0 },
                    participants[2] || { nickname: "N/A", score: 0 }
                ];

                // DOM-Struktur für das Treppchen aufbauen (Reihenfolge: Platz 2, Platz 1, Platz 3 für die Optik)
                wrapper.innerHTML = `
                    <!-- PLATZ 2 -->
                    <div class="podium-box podium-2">
                        <div class="winner-name">${top3[1].nickname}</div>
                        <div class="winner-score">${top3[1].score} Pkt.</div>
                        <div class="rank-number">2</div>
                    </div>
                    
                    <!-- PLATZ 1 -->
                    <div class="podium-box podium-1">
                        <div style="font-size: 3em; margin-bottom: -10px;">👑</div>
                        <div class="winner-name">${top3[0].nickname}</div>
                        <div class="winner-score">${top3[0].score} Pkt.</div>
                        <div class="rank-number">1</div>
                    </div>
                    
                    <!-- PLATZ 3 -->
                    <div class="podium-box podium-3">
                        <div class="winner-name">${top3[2].nickname}</div>
                        <div class="winner-score">${top3[2].score} Pkt.</div>
                        <div class="rank-number">3</div>
                    </div>
                `;
            } catch (e) {
                console.error("Fehler beim Laden der Ergebnisse:", e);
                document.getElementById('podium-wrapper').innerHTML = "<h2>Fehler beim Laden der Ergebnisse.</h2>";
            }
        }

        // Einmalig beim Start laden (kein Polling mehr nötig, da das Event vorbei ist)
        window.addEventListener('load', loadFinalResults);
    </script>
</body>
</html>
