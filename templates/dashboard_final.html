<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WM 2026 - FINALE</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
</head>
<body class="phase-final">
    <div class="confetti-container"></div>
    <div class="main-content">
        <h1>Der Weltmeister der Tipper steht fest!</h1>
        <div class="podium">
            <div class="place second" id="p2">?</div>
            <div class="place first" id="p1">?</div>
            <div class="place third" id="p3">?</div>
        </div>
    </div>
    <script>
        async function loadFinal() {
            const res = await fetch('/api/participants');
            const data = await res.json();
            const s = data.participants.sort((a,b) => b.score - a.score);
            document.getElementById('p1').innerText = s[0].nickname;
            document.getElementById('p2').innerText = s[1].nickname;
            document.getElementById('p3').innerText = s[2].nickname;
        }
        loadFinal();

        // Aktuelle Phase beim Laden der Seite speichern
        let localPhase = "";

        async function checkPhase() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                if (localPhase === "") {
                    localPhase = data.phase; // Initiales Setzen
                } else if (localPhase !== data.phase) {
                    // Die Phase hat sich geändert -> Einfach die Beamer-Seite neu laden!
                    window.location.reload(); 
                }
            } catch (e) { console.error("Polling error"); }
        }
        setInterval(checkPhase, 3000);
    </script>
</body>
</html>
