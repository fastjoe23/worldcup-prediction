<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM 2026 - Siegerehrung</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
    <style>
        /* Layout Korrektur für Leaderboard-Platz */
        .phase-finale .main-content {
            margin-right: 25%;
            transition: margin-right 0.5s ease;
        }

        .podium-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 50vh;
            margin-top: 40px;
            width: 100%;
        }
        
        .podium-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: riseUp 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .podium-1 { background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%); height: 100%; width: 250px; z-index: 3; animation-delay: 5s; }
        .podium-2 { background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%); height: 75%; width: 220px; z-index: 2; animation-delay: 2.5s; }
        .podium-3 { background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%); height: 50%; width: 200px; z-index: 1; animation-delay: 1s; }

        .winner-name {
            font-size: 2em;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            word-break: break-word;
        }

        .winner-score {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            background: rgba(255,255,255,0.4);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .rank-number {
            font-size: 4em;
            font-weight: 900;
            color: rgba(0,0,0,0.1);
            margin-top: 20px;
            line-height: 1;
        }

        /* Leaderboard Side-Panel Animation */
        #leaderboard-container {
            transform: translateX(100%);
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #leaderboard-container.visible {
            transform: translateX(0);
        }

        @keyframes riseUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="phase-finale" style="overflow: hidden;">
    <header class="dashboard-header">
        <div class="logo-left">
            <img src="/static/DHBW_d_S_46mm_4c-1920w.webp" alt="DHBW Logo" class="header-logo">
        </div>
        <div class="round-display">SIEGEREHRUNG</div>
        <div class="logo-right">
            <img src="/static/vers_logo.png" alt="VersLeipzig Logo" class="header-logo">
        </div>
    </header>

    <div class="main-content" style="flex-direction: column; justify-content: center; padding-top: 40px;">
        <h1 class="stage-title" style="font-size: 4em; margin-bottom: 20px;">Endstand</h1>
        <div class="podium-wrapper" id="podium-wrapper">
            <h2 style="color: #666;">Lade Ergebnisse...</h2>
        </div>
    </div>

    <aside class="leaderboard-container" id="leaderboard-container">
        <h3 class="leaderboard-title">🏆 WEITERE PLÄTZE</h3>
        <div class="leaderboard-table" id="leaderboard-table">
            </div>
    </aside>

    <footer class="sponsors-banner">
        <span class="sponsor-text">Partner:</span>
        <img src="/static/adesso_basic_Color_RGB-71eb02c9-1920w.png" alt="Sponsor 1" class="sponsor-logo">
        <img src="/static/logo_msg_RGB-1920w.jpg" alt="Sponsor 2" class="sponsor-logo">
        <img src="/static/viadico_logo-4fb06a49-1920w.png" alt="Sponsor 3" class="sponsor-logo">
    </footer>

    <script>
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        async function loadFinalResults() {
            try {
                const res = await fetch('/api/participants');
                const data = await res.json();
                const participants = data.participants || [];
                
                if (participants.length === 0) return;

                // 1. Podium befüllen
                const top3 = [
                    participants[0] || { nickname: "N/A", score: 0 },
                    participants[1] || { nickname: "N/A", score: 0 },
                    participants[2] || { nickname: "N/A", score: 0 }
                ];

                document.getElementById('podium-wrapper').innerHTML = `
                    <div class="podium-box podium-2">
                        <div class="winner-name">${escapeHTML(top3[1].nickname)}</div>
                        <div class="winner-score">${top3[1].score} Pkt.</div>
                        <div class="rank-number">2</div>
                    </div>
                    <div class="podium-box podium-1">
                        <div style="font-size: 3em; margin-bottom: -10px;">👑</div>
                        <div class="winner-name">${escapeHTML(top3[0].nickname)}</div>
                        <div class="winner-score">${top3[0].score} Pkt.</div>
                        <div class="rank-number">1</div>
                    </div>
                    <div class="podium-box podium-3">
                        <div class="winner-name">${escapeHTML(top3[2].nickname)}</div>
                        <div class="winner-score">${top3[2].score} Pkt.</div>
                        <div class="rank-number">3</div>
                    </div>
                `;

                // 2. Leaderboard (Plätze 4 - 25) vorbereiten
                const table = document.getElementById('leaderboard-table');
                table.innerHTML = '';
                
                participants.slice(3, 25).forEach((entry, index) => {
                    const el = document.createElement('div');
                    el.className = 'leaderboard-entry';
                    el.innerHTML = `
                        <div class="lb-rank">${index + 4}</div>
                        <div class="lb-name">${escapeHTML(entry.nickname)}</div>
                        <div class="lb-score">${entry.score || 0} Pkt.</div>
                    `;
                    table.appendChild(el);
                });

                // 3. Leaderboard erst nach der Podium-Animation einblenden
                
                setTimeout(() => {
                    document.getElementById('leaderboard-container').classList.add('visible');
                }, 6000);

            } catch (e) {
                console.error("Fehler:", e);
            }
        }

        window.addEventListener('load', loadFinalResults);
    </script>
</body>
</html>
