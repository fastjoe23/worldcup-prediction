<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM 2026 - Simulation</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
</head>
<body class="phase-sim phase-runde-1">
    <!-- Header mit Logos -->
    <header class="dashboard-header">
        <div class="logo-left">
            <img src="/static/DHBW_d_S_46mm_4c-1920w.webp" alt="DHBW Logo" class="header-logo">
        </div>
        <div class="logo-right logo-invert">
            <img src="/static/vers_logo.png" alt="VersLeipzig Logo" class="header-logo">
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="main-content">
        <!-- Phase 1: Gruppenphase -->
        <div class="phase-content phase-1-content" id="phase-1-content">
            <!-- Horizontaler Match-Ticker -->
            <div class="match-ticker-wrapper">
                <div class="match-ticker" id="match-ticker">
                    <!-- Matches werden dynamisch eingefügt -->
                </div>
            </div>

            <!-- Gruppen-Grid -->
            <div class="groups-grid" id="groups-grid">
                <!-- 12 Group-Cards (A-L) werden dynamisch erstellt -->
            </div>
        </div>

        <!-- Phase 2: K.O.-Runden -->
        <div class="phase-content phase-2-content" id="phase-2-content" style="display: none;">
            <div class="ko-rounds-container" id="ko-rounds-container">
                <!-- Match-Cards werden dynamisch erstellt (16 → 8 → 4) -->
            </div>
        </div>

        <!-- Phase 3: Halbfinale & Finale -->
        <div class="phase-content phase-3-content" id="phase-3-content" style="display: none;">
            <div class="final-container" id="final-container">
                <!-- Finale-Cards werden dynamisch erstellt -->
            </div>
            <div class="timer-display" id="timer-display">
                <div class="timer-minutes" id="timer-minutes">00</div>
                <div class="timer-separator">:</div>
                <div class="timer-seconds" id="timer-seconds">00</div>
                <div class="timer-label">Minuten</div>
            </div>
        </div>
    </div>

    <!-- Leaderboard (immer sichtbar) -->
    <aside class="leaderboard-container" id="leaderboard-container">
        <h3 class="leaderboard-title">🏆 TOP 10</h3>
        <div class="leaderboard-table" id="leaderboard-table">
            <!-- Leaderboard-Einträge werden dynamisch eingefügt -->
        </div>
    </aside>

    <!-- QR-Code Mini (unten rechts) -->
    <div class="qr-mini">
        <img src="/static/qrcode.png" alt="QR-Code">
    </div>

    <!-- Sponsoren-Banner (unten) -->
    <footer class="sponsors-banner">
        <span class="sponsor-text">Partner:</span>
        <img src="/static/adesso_basic_Color_RGB-71eb02c9-1920w.png" alt="Sponsor 1" class="sponsor-logo">
        <img src="/static/logo_msg_RGB-1920w.jpg" alt="Sponsor 2" class="sponsor-logo">
        <img src="/static/viadico_logo-4fb06a49-1920w.png" alt="Sponsor 3" class="sponsor-logo">
    </footer>

<script>
        // ===========================
        // STATE & DATA MANAGEMENT
        // ===========================
        let currentPhase = null;
        let masterData = null;
        let leaderboardData = [];
        let previousLeaderboardOrder = [];
        const PHASE_1_GROUPS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
        
        let phaseInterval = null;
        let leaderboardInterval = null;

        // ===========================
        // HELPER FUNCTIONS
        // ===========================
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ===========================
        // POLLING FUNCTIONS
        // ===========================
        async function checkPhase() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                const newPhase = data.phase;

                if (currentPhase !== null && currentPhase !== newPhase) {
                    // Sauberes Aufräumen vor dem Reload (verhindert Memory Leaks)
                    if (phaseInterval) clearInterval(phaseInterval);
                    if (leaderboardInterval) clearInterval(leaderboardInterval);
                    window.location.reload();
                }
            } catch (e) {
                console.error("Phase polling error:", e);
            }
        }

        async function fetchSimData() {
            try {
                const res = await fetch('/api/dashboard/sim-results');
                if (!res.ok) throw new Error("Sim data fetch failed");
                const data = await res.json();
                masterData = data;
                return data;
            } catch (e) {
                console.error("Sim data polling error:", e);
                return null;
            }
        }

        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/participants');
                if (!res.ok) throw new Error("Leaderboard fetch failed");
                const data = await res.json();
                leaderboardData = data.participants || [];
                animateLeaderboardUpdate();
            } catch (e) {
                console.error("Leaderboard error:", e);
            }
        }

        // ===========================
        // LEADERBOARD FLIP ANIMATION
        // ===========================
        function animateLeaderboardUpdate() {
            const table = document.getElementById('leaderboard-table');
            const newEntries = leaderboardData.slice(0, 10);

            const newOrder = newEntries.map(e => e.nickname).join(',');
            const oldOrder = previousLeaderboardOrder.join(',');

            if (newOrder === oldOrder && table.children.length > 0) {
                return; // Keine Änderung
            }

            // FLIP Animation (Optimiert gegen Layout Thrashing)
            
            // 1. FIRST (Old positions lesen)
            const oldRects = new Map();
            Array.from(table.children).forEach(el => {
                oldRects.set(el.getAttribute('data-nickname'), el.getBoundingClientRect());
            });

            // 2. DOM UPDATE (DocumentFragment für bessere Performance)
            previousLeaderboardOrder = newOrder.split(',');
            table.innerHTML = '';
            const fragment = document.createDocumentFragment();
            
            newEntries.forEach((entry, index) => {
                const el = document.createElement('div');
                el.className = 'leaderboard-entry';
                el.setAttribute('data-nickname', entry.nickname);
                el.innerHTML = `
                    <div class="lb-rank">${index + 1}</div>
                    <div class="lb-name">${entry.nickname}</div>
                    <div class="lb-score">${entry.score || 0} Pkt.</div>
                `;
                fragment.appendChild(el);
            });
            table.appendChild(fragment);

            // 3. LAST (New positions lesen)
            const newRects = new Map();
            const newElements = Array.from(table.children);
            newElements.forEach(el => {
                newRects.set(el.getAttribute('data-nickname'), el.getBoundingClientRect());
            });

            // 4. INVERT (Transformieren ohne Transition)
            newElements.forEach(el => {
                const nickname = el.getAttribute('data-nickname');
                const oldRect = oldRects.get(nickname);
                const newRect = newRects.get(nickname);

                if (oldRect && newRect) {
                    const deltaY = oldRect.top - newRect.top;
                    el.style.transition = 'none'; // WICHTIG!
                    el.style.transform = `translateY(${deltaY}px)`;
                    el.style.opacity = '0.8';
                }
            });

            // 5. PLAY (Reflow nur 1x triggern, dann Transition setzen)
            table.offsetHeight; // Einziger Reflow!

            newElements.forEach(el => {
                el.style.transition = 'all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                el.style.transform = 'translateY(0)';
                el.style.opacity = '1';
            });
        }

        // ===========================
        // PHASE 1: GRUPPENPHASE
        // ===========================
        let liveGroupStats = {};

        async function initPhase1() {
            console.log("Initializing Phase 1 - Gruppenphase");
            document.body.className = 'phase-sim phase-runde-1';
            document.getElementById('phase-1-content').style.display = 'block';
            document.getElementById('phase-2-content').style.display = 'none';
            document.getElementById('phase-3-content').style.display = 'none';

            const data = masterData || await fetchSimData();
            if (!data) return;

            initLiveGroupStats(data.standings || {});
            createGroupsGrid();
            document.getElementById('match-ticker').innerHTML = '';
            await runGroupTimeline(data.matches || []);
        }

        function initLiveGroupStats(finalStandings) {
            liveGroupStats = {};
            PHASE_1_GROUPS.forEach(groupLetter => {
                const teams = finalStandings[groupLetter] || [];
                liveGroupStats[groupLetter] = teams.map(t => ({
                    team: t.team || t.name, // Fallback für Sicherheit
                    p: 0,
                    diff: 0,
                    goals: 0
                }));
            });
        }

        function createGroupsGrid() {
            const grid = document.getElementById('groups-grid');
            grid.innerHTML = '';

            PHASE_1_GROUPS.forEach(groupLetter => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.id = `group-${groupLetter}`;
                card.innerHTML = `
                    <h3 class="group-title">Gruppe ${groupLetter}</h3>
                    <div class="group-table" id="table-${groupLetter}"></div>
                `;
                grid.appendChild(card);
                updateGroupDOM(groupLetter); // Initiale Befüllung
            });
        }

        async function runGroupTimeline(matches) {
            for (const match of matches) {
                pushToTicker(match);

                const [hGoalsStr = '0', aGoalsStr = '0'] = (match.score || '0:0').split(':');
                const hGoals = parseInt(hGoalsStr, 10);
                const aGoals = parseInt(aGoalsStr, 10);
                
                const group = match.group;
                if (!liveGroupStats[group]) continue;

                const hTeam = liveGroupStats[group].find(t => t.team === match.home);
                const aTeam = liveGroupStats[group].find(t => t.team === match.away);

                if (hTeam && aTeam) {
                    if (hGoals > aGoals) { hTeam.p += 3; }
                    else if (aGoals > hGoals) { aTeam.p += 3; }
                    else { hTeam.p += 1; aTeam.p += 1; }

                    hTeam.diff += (hGoals - aGoals);
                    aTeam.diff += (aGoals - hGoals);
                    hTeam.goals += hGoals;
                    aTeam.goals += aGoals;

                    liveGroupStats[group].sort((a, b) => {
                        if (b.p !== a.p) return b.p - a.p;
                        if (b.diff !== a.diff) return b.diff - a.diff;
                        return b.goals - a.goals;
                    });

                    updateGroupDOM(group, match.home, match.away);
                }
                await sleep(500); 
            }

            // Kurze dramaturgische Pause nach dem letzten Spiel
            await sleep(1000);

            // Gruppensieger mit Animation hervorheben
            PHASE_1_GROUPS.forEach(groupLetter => {
                const tableContainer = document.getElementById(`table-${groupLetter}`);
                if (tableContainer && tableContainer.children.length > 0) {
                    // Da die Liste live sortiert wurde, ist das erste Element (Index 0) immer der Sieger
                    const winnerRow = tableContainer.children[0];
                    winnerRow.classList.add('group-winner');
                }
            });
        }

        // Optimiert: Nutzt textContent statt innerHTML falls Nodes bereits existieren
        function updateGroupDOM(groupLetter, team1 = null, team2 = null) {
            const tableContainer = document.getElementById(`table-${groupLetter}`);
            if (!tableContainer) return;

            const teams = liveGroupStats[groupLetter] || [];
            
            // Wenn leer, baue das Gerüst
            if (tableContainer.children.length === 0) {
                tableContainer.innerHTML = teams.map((entry, idx) => `
                    <div class="group-row" data-team="${entry.team}">
                        <div class="group-rank">${idx + 1}</div>
                        <div class="group-name">${entry.team}</div>
                        <div class="group-stat">${entry.p}P</div>
                        <div class="group-stat">${entry.diff > 0 ? '+' : ''}${entry.diff}</div>
                    </div>
                `).join('');
                return;
            }

            // Wenn vorhanden, aktualisiere nur den Text (besser für DOM Performance)
            teams.forEach((entry, idx) => {
                const row = tableContainer.children[idx];
                const isHighlight = (entry.team === team1 || entry.team === team2) ? 'highlight-row' : '';
                
                row.className = `group-row ${isHighlight}`;
                row.setAttribute('data-team', entry.team);
                row.children[0].textContent = idx + 1;
                row.children[1].textContent = entry.team;
                row.children[2].textContent = `${entry.p}P`;
                row.children[3].textContent = `${entry.diff > 0 ? '+' : ''}${entry.diff}`;
            });
        }

        function pushToTicker(match) {
            const ticker = document.getElementById('match-ticker');
            const tickerItem = document.createElement('div');
            tickerItem.className = 'ticker-item';
            const [homeGoals = '0', awayGoals = '0'] = (match.score || '0:0').split(':');
            
            tickerItem.innerHTML = `
                <div class="ticker-match">
                    <span class="ticker-team">${match.home || '—'}</span>
                    <span class="ticker-result">${homeGoals}-${awayGoals}</span>
                    <span class="ticker-team">${match.away || '—'}</span>
                </div>
            `;
            
            ticker.prepend(tickerItem);
            if (ticker.children.length > 10) {
                ticker.lastChild.remove();
            }
        }

        // ===========================
        // PHASE 2: K.O.-RUNDEN
        // ===========================
        async function initPhase2() {
            console.log("Initializing Phase 2 - K.O.-Runden");
            document.body.className = 'phase-sim phase-runde-2';
            document.getElementById('phase-1-content').style.display = 'none';
            document.getElementById('phase-2-content').style.display = 'block';
            document.getElementById('phase-3-content').style.display = 'none';

            const data = masterData || await fetchSimData();
            if (!data) return;

            const r32Matches = data.r32 || [];
            const r16Matches = data.r16 || [];
            const qfMatches = data.qf || [];
            await runKORoundTimeline(r32Matches, r16Matches, qfMatches);
        }

        async function runKORoundTimeline(r32Matches, r16Matches, qfMatches) {
            const container = document.getElementById('ko-rounds-container');

            if (r32Matches.length > 0) {
                await runKOStage(container, r32Matches, 16, 'stage1');
                await sleep(3000);
            }
            if (r16Matches.length > 0) {
                await runKOStage(container, r16Matches, 8, 'stage2');
                await sleep(3000);
            }
            if (qfMatches.length > 0) {
                await runKOStage(container, qfMatches, 4, 'stage3');
            }
        }

        async function runKOStage(container, matches, gridSize, stageName) {
            container.innerHTML = '';
            container.className = `ko-grid ko-grid-${gridSize} ${stageName}`;

            matches.forEach((match, idx) => {
                const card = createMatchCard(match, idx, true);
                container.appendChild(card);
            });

            const cards = container.querySelectorAll('.match-card');
            const shuffledIndices = shuffle([...Array(cards.length).keys()]);

            for (const idx of shuffledIndices) {
                const match = matches[idx];
                const card = cards[idx];
                await sleep(600);

                if (match.score) {
                    const [homeGoals = '0', awayGoals = '0'] = match.score.split(':');
                    const resultEl = card.querySelector('.match-result');
                    resultEl.innerHTML = `${homeGoals}-${awayGoals}`;
                    resultEl.dataset.empty = "false";
                    resultEl.classList.add('result-pop');
                }
            }

            if (gridSize > 4) {
                await sleep(2000);
                container.classList.add('zoom-out');
                await sleep(500);
                container.classList.remove('zoom-out');
            }
        }

        function createMatchCard(match, index, showEmpty = false) {
            const card = document.createElement('div');
            card.className = 'match-card';
            let displayScore = '0-0';
            if (!showEmpty && match.score) {
                displayScore = match.score;
            }
            
            const t1 = match.team1 || match.home || '—';
            const t2 = match.team2 || match.away || '—';

            card.innerHTML = `
                <div class="match-header">${match.round || 'K.O.'}</div>
                <div class="match-teams">
                    <div class="match-team">${t1}</div>
                    <div class="match-result" ${showEmpty ? 'data-empty="true"' : 'data-empty="false"'}>
                        ${displayScore}
                    </div>
                    <div class="match-team">${t2}</div>
                </div>
            `;
            return card;
        }

        // ===========================
        // PHASE 3: HALBFINALE & FINALE
        // ===========================
        async function initPhase3() {
            console.log("Initializing Phase 3 - Halbfinale & Finale");
            document.body.className = 'phase-sim phase-finale';
            document.getElementById('phase-1-content').style.display = 'none';
            document.getElementById('phase-2-content').style.display = 'none';
            document.getElementById('phase-3-content').style.display = 'block';

            const data = masterData || await fetchSimData();
            if (!data) return;

            const semifinals = data.sf || [];
            const finals = data.f || [];
            await runFinalTimeline(semifinals, finals);
        }

        async function runFinalTimeline(semifinals, finals) {
            const container = document.getElementById('final-container');

            for (const match of semifinals) {
                container.innerHTML = '';
                const card = createMatchCard(match, 0, true);
                container.appendChild(card);

                await runFinalMatch(match, card);
                await sleep(2000);
            }

            if (finals.length > 0) {
                container.innerHTML = '';
                const finalCard = createMatchCard(finals[0], 0, true);
                finalCard.classList.add('final-card');
                container.appendChild(finalCard);

                await runFinalMatch(finals[0], finalCard);
            }
        }

        async function runFinalMatch(match, cardElement) {
            const timerDisplay = document.getElementById('timer-display');
            const resultEl = cardElement.querySelector('.match-result');
            resultEl.dataset.empty = "false";

            const [targetHomeGoalsStr = '0', targetAwayGoalsStr = '0'] = (match.score || '0:0').split(':');
            const targetHomeGoals = parseInt(targetHomeGoalsStr, 10);
            const targetAwayGoals = parseInt(targetAwayGoalsStr, 10);

            const goalMinutes = [];
            for (let i = 0; i < targetHomeGoals; i++) goalMinutes.push({ minute: Math.floor(Math.random() * 88) + 1, isHome: true });
            for (let i = 0; i < targetAwayGoals; i++) goalMinutes.push({ minute: Math.floor(Math.random() * 88) + 1, isHome: false });
            goalMinutes.sort((a, b) => a.minute - b.minute);

            let homeGoals = 0;
            let awayGoals = 0;
            let goalIndex = 0;

            for (let minute = 0; minute <= 90; minute++) {
                updateTimer(minute);

                if (goalIndex < goalMinutes.length && goalMinutes[goalIndex].minute === minute) {
                    if (goalMinutes[goalIndex].isHome) homeGoals++;
                    else awayGoals++;
                    
                    resultEl.innerHTML = `${homeGoals}-${awayGoals}`;
                    resultEl.classList.remove('result-pop');
                    void resultEl.offsetWidth; // Force reflow to restart animation
                    resultEl.classList.add('result-pop');
                    
                    await sleep(300);
                    goalIndex++;
                }
                await sleep(400); 
            }
            
            // Ensure final score is accurate in case of skipped minutes
            resultEl.innerHTML = `${targetHomeGoals}-${targetAwayGoals}`;
            updateTimer(90);
        }

        function updateTimer(minutes) {
            const mins = Math.floor(minutes);
            const secs = Math.round((minutes % 1) * 60);

            document.getElementById('timer-minutes').textContent = String(mins).padStart(2, '0');
            document.getElementById('timer-seconds').textContent = String(secs).padStart(2, '0');
        }

        // ===========================
        // MAIN ENTRY POINT
        // ===========================
        async function main() {
            console.log("Dashboard SIM initialized");

            try {
                // Initialize State
                const phaseRes = await fetch('/api/state');
                if (!phaseRes.ok) throw new Error("Could not fetch initial state");
                const phaseData = await phaseRes.json();
                currentPhase = phaseData.phase;

                // Pre-fetch Data
                await fetchSimData();
                await fetchLeaderboard();

                // Start Phase Logic
                if (currentPhase === "RUNDE_1_SIM") {
                    await initPhase1();
                } else if (currentPhase === "RUNDE_2_SIM") {
                    await initPhase2();
                } else if (currentPhase === "FINALE_SIM") {
                    await initPhase3();
                }

                // Setup Managed Intervals
                if (phaseInterval) clearInterval(phaseInterval);
                if (leaderboardInterval) clearInterval(leaderboardInterval);
                
                phaseInterval = setInterval(checkPhase, 3000);
                leaderboardInterval = setInterval(fetchLeaderboard, 2000);

            } catch (e) { 
                console.error("Critical initialization error:", e);
                // Retry nach 5 Sekunden, falls der Server kurz weg war
                setTimeout(main, 5000);
            }
        }

        // Start on page load
        window.addEventListener('load', main);
    </script>
</body>
</html>
