<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM 2026 - Tipp-Trends</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
    <link rel="stylesheet" href="/static/dashboard_tippen_style.css">
    <script src="/static/chart.js"></script>
</head>
<body class="phase-tippen">
  <!-- Header mit Logos -->
    <header class="dashboard-header">
        <div class="logo-left">
            <img src="/static/DHBW_d_S_46mm_4c-1920w.webp" alt="DHBW Logo" class="header-logo">
        </div>
        <div id="current-round-title" class="round-display">GRUPPENPHASE</div>      
        <div class="progress-section">
            <div class="progress-info">
                <span id="progress-text">Warte auf Teilnehmer...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>
        <div class="logo-right">
            <img src="/static/vers_logo.png" alt="VersLeipzig Logo" class="header-logo">
        </div>


    </header>

    <main class="main-content">
        <div id="trends-runde-1" class="trend-container" style="display: none;">
            <h1 class="trend-title">Aktuelle Favoriten pro Gruppe</h1>
            <div id="groups-grid" class="groups-grid">
                </div>
        </div>

        <div id="trends-runde-2" class="trend-container" style="display: none;">
            <h1 class="trend-title">Wer zieht ins Halbfinale ein?</h1>
            <div class="chart-wrapper">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div id="trends-finale" class="trend-container" style="display: none;">
            <h1 class="trend-title">Der Weltmeister</h1>
            <div class="pie-chart-container">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </main>

    <div class="qr-mini">
        <img src="/static/qrcode.png" alt="QR Code">
        <p>Scannen & Tippen!</p>
    </div>

    <script>
        let currentPhase = "";
        let barChart = null;
        let pieChart = null;

        async function updateDashboard() {
            try {
                const stateRes = await fetch('/api/state');
                if (!stateRes.ok) return;
                const state = await stateRes.json();

                if (!state.phase.endsWith("_TIPP")) {
                    window.location.href = '/dashboard';
                    return;
                }
                
                if (currentPhase !== state.phase) {
                    currentPhase = state.phase;
                    initLayout(currentPhase);
                }

                const progRes = await fetch('/api/dashboard/progress');
                if (progRes.ok) {
                    const prog = await progRes.json();
                    document.getElementById('progress-bar').style.width = (prog.percent || 0) + '%';
                    document.getElementById('progress-text').innerText = `${prog.submitted || 0} von ${prog.total || 0} Teilnehmern haben getippt`;
                    document.getElementById('progress-percent').innerText = (prog.percent || 0) + '%';
                }

                const trendRes = await fetch('/api/dashboard/tipping-trends');
                if (!trendRes.ok) return;
                const trendData = await trendRes.json();

                // FEHLERBEHEBUNG: Hier prüfen wir explizit, ob die Keys im JSON existieren
                if (currentPhase.includes("RUNDE_1") && trendData.groups) {
                    renderGroupTrends(trendData.groups);
                } else if (currentPhase.includes("RUNDE_2") && trendData.counts) {
                    renderBarChart(trendData.counts);
                } else if (currentPhase.includes("FINALE") && trendData.counts) {
                    renderPieChart(trendData.counts);
                }

            } catch (e) { 
                console.error("Update Error:", e); 
            }
        }

        function initLayout(phase) {
            document.getElementById('trends-runde-1').style.display = phase.includes("RUNDE_1") ? "block" : "none";
            document.getElementById('trends-runde-2').style.display = phase.includes("RUNDE_2") ? "block" : "none";
            document.getElementById('trends-finale').style.display = phase.includes("FINALE") ? "block" : "none";
        }

        function renderGroupTrends(groups) {
            const grid = document.getElementById('groups-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            // FEHLERBEHEBUNG: Prüfen, ob groups existiert
            if (!groups || typeof groups !== 'object') {
                console.warn("renderGroupTrends: Keine gültigen Gruppendaten erhalten", groups);
                return;
            }

            for (const [group, teams] of Object.entries(groups)) {
                // Sicherstellen, dass teams ein Objekt ist
                const teamEntries = teams ? Object.entries(teams) : [];
                const sortedTeams = teamEntries.sort((a, b) => b[1] - a[1]);
                
                const card = document.createElement('div');
                card.className = 'group-trend-card';
                card.innerHTML = `<h3>Gruppe ${group}</h3><ul>` + 
                    (sortedTeams.length > 0 ? sortedTeams.map(([name, count], idx) => `
                        <li class="${idx === 0 ? 'top-pick' : ''}">
                            <span class="team-name">${name}</span>
                            <span class="vote-count">${count} Tipps</span>
                        </li>
                    `).join('') : '<li>Noch keine Tipps</li>') + `</ul>`;
                grid.appendChild(card);
            }
        }

        function renderBarChart(data) {
            const ctx = document.getElementById('barChart');
            if (!ctx || !data) return;
            
            const sorted = Object.entries(data).sort((a,b) => b[1] - a[1]);
            const labels = sorted.map(s => s[0]);
            const values = sorted.map(s => s[1]);

            if (barChart) {
                barChart.data.labels = labels;
                barChart.data.datasets[0].data = values;
                barChart.update('none'); // 'none' verhindert unnötige Animationen bei jedem Polling
            } else {
                barChart = new Chart(ctx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Anzahl Tipps',
                            data: values,
                            backgroundColor: '#667eea',
                            borderRadius: 10
                        }]
                    },
                    options: { 
                        indexAxis: 'y', 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, grid: { display: false } } }
                    }
                });
            }
        }

        function renderPieChart(data) {
            const ctx = document.getElementById('pieChart');
            if (!ctx || !data) return;
            
            const labels = Object.keys(data);
            const values = Object.values(data);

            if (pieChart) {
                pieChart.data.labels = labels;
                pieChart.data.datasets[0].data = values;
                pieChart.update();
            } else {
                pieChart = new Chart(ctx.getContext('2d'), {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a']
                        }]
                    },
                    options: { 
                        responsive: true, 
                        plugins: { 
                            legend: { 
                                position: 'bottom', 
                                labels: { color: '#1a1a2e', font: { size: 16, weight: 'bold' } } 
                            } 
                        } 
                    }
                });
            }
        }

        setInterval(updateDashboard, 1500);
        updateDashboard();
    </script>
</body>
</html>
