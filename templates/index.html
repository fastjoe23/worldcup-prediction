<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Tippspiel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card" id="app-container">
        <h1>🏆 Lade Event-Status...</h1>
    </div>

    <script>
        let currentPhase = "";

        // WM 2026 Gruppen und Teams
        const GROUPS = {
            "Gruppe A": ["Mexiko", "Südafrika", "Südkorea", "Tschechien"],
            "Gruppe B": ["Kanada", "Bosnien & Herzegowina", "Katar", "Schweiz"],
            "Gruppe C": ["Brasilien", "Marokko", "Haiti", "Schottland"],
            "Gruppe D": ["USA", "Paraguay", "Australien", "Türkei"],
            "Gruppe E": ["Deutschland", "Curaçao", "Elfenbeinküste", "Ecuador"],
            "Gruppe F": ["Niederlande", "Japan", "Schweden", "Tunesien"],
            "Gruppe G": ["Belgien", "Ägypten", "Iran", "Neuseeland"],
            "Gruppe H": ["Spanien", "Kap Verde", "Saudi-Arabien", "Uruguay"],
            "Gruppe I": ["Frankreich", "Senegal", "Irak", "Norwegen"],
            "Gruppe J": ["Argentinien", "Algerien", "Österreich", "Jordanien"],
            "Gruppe K": ["Portugal", "DR Kongo", "Usbekistan", "Kolumbien"],
            "Gruppe L": ["England", "Kroatien", "Ghana", "Panama"]
        };

        // Das "Kahoot-Polling": Fragt alle 3 Sekunden nach der Phase
        async function checkPhase() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                if (data.phase !== currentPhase) {
                    currentPhase = data.phase;
                    renderUI(currentPhase);
                }
            } catch (e) { console.error("Verbindungsproblem", e); }
        }

        setInterval(checkPhase, 3000);
        checkPhase(); // Sofort beim Start ausführen

        // Helper function to show success modal
        function showSuccessModal(title, message, waitingMessage) {
            const modal = document.createElement('div');
            modal.className = 'success-modal';
            modal.innerHTML = `
                <div class="success-modal-content">
                    <div class="success-icon">✅</div>
                    <h2>${title}</h2>
                    <p>${message}</p>
                    ${waitingMessage ? `<p class="waiting-text">${waitingMessage}</p>` : ''}
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Helper function to clear success modal
        function clearSuccessModal() {
            const modals = document.querySelectorAll('.success-modal');
            modals.forEach(m => m.remove());
        }

        function renderUI(phase) {
            const container = document.getElementById('app-container');
            clearSuccessModal(); // Clear any previous modals when phase changes
            
            if (phase === "START") {
                container.innerHTML = "<h1>🏆 Willkommen!</h1><p>Gleich geht die erste Tipprunde los. Schau auf den Beamer!</p>";
            } 
            else if (phase === "RUNDE_1_NICKNAME") {
                // Phase 1: Nickname wählen
                container.innerHTML = `
                    <h1>✍️ Gib deinen Nickname ein</h1>
                    <p>Dein Nickname wird für alle deine Tipps verwendet.</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <input type="text" id="nickname" placeholder="Dein Nickname" maxlength="50">
                    <button id="nicknameButton">Nickname bestätigen</button>
                    <div id="msg"></div>
                `;
                document.getElementById('nicknameButton').addEventListener('click', submitNickname);
            }
            else if (phase === "RUNDE_1_GRUPPEN_TIPP") {
                // Phase 2: Group winners (12 dropdowns)
                const savedNick = localStorage.getItem('userNickname');
                let groupsHTML = `
                    <h1>✍️ Tipprunde ist offen!</h1>
                `;
                
                if (savedNick) {
                    groupsHTML += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                }
                
                groupsHTML += `
                    <p>Tipp den Gruppensieger für jede Gruppe:</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                `;
                
                for (const [groupName, teams] of Object.entries(GROUPS)) {
                    groupsHTML += `
                        <div class="group-selector">
                            <label>${groupName}</label>
                            <select id="group_${groupName.replace(/\s/g, '_')}">
                                <option value="">-- Wähle einen Sieger --</option>
                    `;
                    teams.forEach(team => {
                        groupsHTML += `<option value="${team}">${team}</option>`;
                    });
                    groupsHTML += `
                            </select>
                        </div>
                    `;
                }
                
                groupsHTML += `
                    <button id="selectionsButton">Tipps abgeben</button>
                    <div id="msg"></div>
                `;
                
                container.innerHTML = groupsHTML;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            }
            else if (phase === "RUNDE_2_TIPP") {
                // Round 2: Select 4 semi-finalists from 12 group winners
                loadRound2UI(container);
            }
            else if (phase === "FINALE_TIPP") {
                // Finals: Select 1 champion from 4 semi-finalists
                loadFinalsUI(container);
            }
            else if (phase === "FINALE_SIM") {
                // Game Over: Show final summary
                loadFinaleSummary(container);
            }
            else if (phase.includes("TIPP")) {
                // Fallback für andere Tipp-Phasen
                container.innerHTML = "<h1>✍️ Tipprunde ist offen!</h1><p>Bitte einen Moment warten...</p>";
            }
            else if (phase.includes("SIM")) {
                container.innerHTML = "<h1>⚽ Simulation läuft!</h1><p>Die Tipps sind geschlossen. Schau auf die Leinwand für die Ergebnisse!</p>";
            }
        }

        async function loadRound2UI(container) {
            const savedNick = localStorage.getItem('userNickname');
            
            try {
                const res = await fetch('/api/latest-results');
                const data = await res.json();
                
                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Ergebnisse aus Runde 1 gefunden!</p>";
                    return;
                }
                
                const teams = data.teams;
                
                let html = `
                    <h1>🏅 Halbfinale-Tipps</h1>
                `;
                
                if (savedNick) {
                    html += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                }
                
                html += `
                    <p>Wähle die 4 Teams aus, die ins Halbfinale kommen:</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <div class="teams-grid">
                `
                
                teams.forEach(team => {
                    html += `
                        <label>
                            <input type="checkbox" class="team-checkbox" value="${team}">
                            ${team}
                        </label>
                    `;
                });
                
                html += `
                    </div>
                    <button id="selectionsButton" style="margin-top: 20px;">Tipps abgeben</button>
                    <div id="msg"></div>
                `;
                
                container.innerHTML = html;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Daten konnten nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function loadFinalsUI(container) {
            const savedNick = localStorage.getItem('userNickname');
            
            try {
                const res = await fetch('/api/latest-results');
                const data = await res.json();
                
                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Ergebnisse aus Runde 2 gefunden!</p>";
                    return;
                }
                
                const teams = data.teams;
                
                let html = `
                    <h1>🏆 Weltmeister-Tipp</h1>
                `;
                
                if (savedNick) {
                    html += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                }
                
                html += `
                    <p>Wer wird Weltmeister?</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <div class="finals-options">
                `
                
                teams.forEach(team => {
                    html += `
                        <label>
                            <input type="radio" class="champion-radio" name="champion" value="${team}">
                            ${team}
                        </label>
                    `;
                })
                
                html += `
                    </div>
                    <button id="selectionsButton" style="margin-top: 20px;">Tipp abgeben</button>
                    <div id="msg"></div>
                `;
                
                container.innerHTML = html;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Daten konnten nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function loadFinaleSummary(container) {
            const savedNick = localStorage.getItem('userNickname');
            
            if (!savedNick) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Kein Nickname gefunden!</p>";
                return;
            }
            
            try {
                const res = await fetch(`/api/user-summary?nickname=${encodeURIComponent(savedNick)}`);
                const data = await res.json();
                
                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>" + data.error + "</p>";
                    return;
                }
                
                let html = `
                    <div style="text-align: center; padding: 20px;">
                        <h1>🏆 Turnier vorbei!</h1>
                        <p style="font-size: 1.2em; color: #666;">Danke dass du mitgemacht hast, <strong>${data.nickname}</strong>!</p>
                        
                        <div class="score-box">
                            <p>Dein Endergebnis</p>
                            <h2>${data.total_score} Punkte</h2>
                        </div>
                        
                        <h3 style="margin-top: 40px; margin-bottom: 20px;">📋 Deine Tipps pro Runde</h3>
                `;
                
                // Round-by-round results
                data.rounds.forEach(round => {
                    const roundName = round.phase === "RUNDE_1_GRUPPEN_TIPP" ? "Runde 1: Gruppensieger" :
                                     round.phase === "RUNDE_2_TIPP" ? "Runde 2: Halbfinale" :
                                     "Finale: Weltmeister";
                    
                    html += `
                        <div class="summary-section">
                            <h4>${roundName} (${round.user_score} Punkte)</h4>
                    `;
                    
                    if (round.phase === "RUNDE_1_GRUPPEN_TIPP") {
                        // Show table of comparisons for Round 1
                        html += `
                            <table>
                                <tr>
                                    <td data-label="Gruppe">Gruppe</td>
                                    <td data-label="Dein Tipp">Dein Tipp</td>
                                    <td data-label="Ergebnis">Ergebnis</td>
                                    <td data-label="✓">✓</td>
                                </tr>
                        `;
                        round.comparisons.forEach(comp => {
                            const checkmark = comp.correct ? '✅' : '❌';
                            html += `
                                <tr>
                                    <td data-label="Gruppe">${comp.category}</td>
                                    <td data-label="Dein Tipp">${comp.user_pick}</td>
                                    <td data-label="Ergebnis">${comp.actual}</td>
                                    <td data-label="✓">${checkmark}</td>
                                </tr>
                            `;
                        });
                        html += `</table>`;
                    } 
                    else if (round.phase === "RUNDE_2_TIPP") {
                        // Show semi-finalist picks
                        html += `
                            <p><strong>Deine Tipps:</strong> ${round.comparisons.user_picks.join(', ')}</p>
                            <p><strong>Halbfinalisten:</strong> ${round.comparisons.actual_semis.join(', ')}</p>
                            <p style="color: #28a745; font-weight: bold;">✅ ${round.comparisons.correct_count} Teams richtig!</p>
                        `;
                    } 
                    else if (round.phase === "FINALE_TIPP") {
                        // Show champion pick
                        const checkmark = round.comparisons.correct ? '✅ RICHTIG!' : '❌ Leider nicht';
                        const color = round.comparisons.correct ? '#28a745' : '#dc3545';
                        html += `
                            <p><strong>Dein Favorit:</strong> ${round.comparisons.user_pick}</p>
                            <p><strong>Weltmeister:</strong> ${round.comparisons.actual_champion}</p>
                            <p style="color: ${color}; font-weight: bold; font-size: 1.1em;">${checkmark}</p>
                        `;
                    }
                    
                    html += `</div>`;
                });
                
                html += `
                        <div class="summary-section" style="border-left-color: #28a745; background: #e7f3ff;">
                            <p style="font-size: 1.1em; color: #0066cc; font-weight: bold;">🎉 Danke dass du dabei warst!</p>
                            <p>Wir sehen uns beim nächsten Tippspiel!</p>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Zusammenfassung konnte nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function submitNickname() {
            const nick = document.getElementById('nickname').value;
            const hp = document.getElementById('bot_email').value;

            if (!nick) {
                showSuccessModal('⚠️ Fehler', 'Bitte gib einen Nickname ein!');
                setTimeout(clearSuccessModal, 3000);
                return;
            }

            const res = await fetch('/api/submit-nickname', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nickname: nick, email_hp: hp}),
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                // Store nickname in localStorage for phase 2
                localStorage.setItem('userNickname', nick);
                showSuccessModal(
                    'Nickname gespeichert! 🎉',
                    `Dein Nickname: <strong>${nick}</strong>`,
                    'Warte auf die nächste Phase...'
                );
            } else {
                showSuccessModal('⚠️ Fehler', data.error);
                setTimeout(clearSuccessModal, 3000);
            }
        }

        async function submitSelections() {
            const hp = document.getElementById('bot_email').value;
            const nickname = localStorage.getItem('userNickname');
            
            if (!nickname) {
                showSuccessModal('⚠️ Fehler', 'Kein Nickname gefunden. Bitte starte die Phase neu!');
                setTimeout(clearSuccessModal, 3000);
                return;
            }
            
            let selections = null;
            
            // RUNDE_1_GRUPPEN_TIPP: Gather 12 dropdown values
            if (currentPhase === "RUNDE_1_GRUPPEN_TIPP") {
                selections = {};
                let allSelected = true;
                
                for (const groupName of Object.keys(GROUPS)) {
                    const selectId = `group_${groupName.replace(/\s/g, '_')}`;
                    const selectedTeam = document.getElementById(selectId).value;
                    
                    if (!selectedTeam) {
                        allSelected = false;
                        break;
                    }
                    selections[groupName] = selectedTeam;
                }
                
                if (!allSelected) {
                    showSuccessModal('⚠️ Fehler', 'Bitte wähle einen Sieger für alle 12 Gruppen!');
                    setTimeout(clearSuccessModal, 3000);
                    return;
                }
            }
            
            // RUNDE_2_TIPP: Gather checked checkboxes (exactly 4)
            else if (currentPhase === "RUNDE_2_TIPP") {
                const checkedBoxes = document.querySelectorAll('.team-checkbox:checked');
                selections = Array.from(checkedBoxes).map(box => box.value);
                
                if (selections.length !== 4) {
                    showSuccessModal('⚠️ Fehler', 'Bitte wähle exakt 4 Teams aus!');
                    setTimeout(clearSuccessModal, 3000);
                    return;
                }
            }
            
            // FINALE_TIPP: Gather selected radio button (exactly 1)
            else if (currentPhase === "FINALE_TIPP") {
                const selectedRadio = document.querySelector('.champion-radio:checked');
                
                if (!selectedRadio) {
                    showSuccessModal('⚠️ Fehler', 'Bitte wähle einen Champion!');
                    setTimeout(clearSuccessModal, 3000);
                    return;
                }
                
                selections = selectedRadio.value;
            }
            
            if (selections === null) {
                showSuccessModal('⚠️ Fehler', 'Unbekannte Phase!');
                setTimeout(clearSuccessModal, 3000);
                return;
            }

            const res = await fetch('/api/submit-selections', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nickname: nickname, selections: selections, email_hp: hp}),
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                showSuccessModal(
                    'Tipps abgegeben! 🏆',
                    'Deine Tipps wurden erfolgreich gespeichert.',
                    'Warte auf die nächste Phase...'
                );
            } else {
                showSuccessModal('⚠️ Fehler', data.error);
                setTimeout(clearSuccessModal, 3000);
            }
        }
    </script>
</body>
</html>
