<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>WM Tippspiel</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="card" id="app-container">
        <h1>🏆 Lade Event-Status...</h1>
    </div>

    <script>
        let currentPhase = "";

        // WM 2026 Gruppen und Teams
        const GROUPS = {
            "Gruppe A": ["Mexiko", "Südafrika", "Südkorea", "Tschechien"],
            "Gruppe B": ["Kanada", "Bosnien & Herzegowina", "Katar", "Schweiz"],
            "Gruppe C": ["Brasilien", "Marokko", "Haiti", "Schottland"],
            "Gruppe D": ["USA", "Paraguay", "Australien", "Türkei"],
            "Gruppe E": ["Deutschland", "Curaçao", "Elfenbeinküste", "Ecuador"],
            "Gruppe F": ["Niederlande", "Japan", "Schweden", "Tunesien"],
            "Gruppe G": ["Belgien", "Ägypten", "Iran", "Neuseeland"],
            "Gruppe H": ["Spanien", "Kap Verde", "Saudi-Arabien", "Uruguay"],
            "Gruppe I": ["Frankreich", "Senegal", "Irak", "Norwegen"],
            "Gruppe J": ["Argentinien", "Algerien", "Österreich", "Jordanien"],
            "Gruppe K": ["Portugal", "DR Kongo", "Usbekistan", "Kolumbien"],
            "Gruppe L": ["England", "Kroatien", "Ghana", "Panama"]
        };

        // Das "Kahoot-Polling": Fragt alle 3 Sekunden nach der Phase
        async function checkPhase() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                if (data.phase !== currentPhase) {
                    currentPhase = data.phase;
                    renderUI(currentPhase);
                }
            } catch (e) { console.error("Verbindungsproblem", e); }
        }

        let phaseInterval = setInterval(checkPhase, 3000);
        checkPhase(); // Sofort beim Start ausführen

        // Helper function to show success modal (Green with checkmark)
        function showSuccessModal(title, message) {
            const modal = document.createElement('div');
            modal.className = 'success-modal';
            modal.innerHTML = `
                <div class="success-modal-content">
                    <div class="success-icon" style="color: #28a745;">✅</div>
                    <h2 style="color: #28a745;">${title}</h2>
                    <p style="color: #0d6e2f;">${message}</p>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Helper function to show error modal (Red with X)
        function showErrorModal(title, message) {
            const modal = document.createElement('div');
            modal.className = 'success-modal';
            modal.innerHTML = `
                <div class="success-modal-content">
                    <div class="success-icon" style="color: #dc3545;">❌</div>
                    <h2 style="color: #dc3545;">${title}</h2>
                    <p style="color: #721c24;">${message}</p>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Helper function to clear success modal
        function clearSuccessModal() {
            const modals = document.querySelectorAll('.success-modal');
            modals.forEach(m => m.remove());
        }

        // Render a "Submitted" view showing user's picks
        function renderSubmittedView(container, phase, picks) {
            let html = `
                <div style="text-align: center; padding: 20px;">
                    <h1>✅ Tipps erfolgreich abgegeben!</h1>
                    <p style="color: #666; font-size: 1.1em; margin: 20px 0;">Deine Tipps wurden gespeichert.</p>
            `;

            if (phase === "RUNDE_1_GRUPPEN_TIPP") {
                // Show group winners
                html += `<h3 style="margin-top: 30px; margin-bottom: 15px;">📋 Deine Gruppensieger</h3>`;
                html += `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;">`;
                for (const [group, team] of Object.entries(picks)) {
                    html += `
                        <div style="background: #f0f0f0; padding: 12px; border-radius: 6px; text-align: left;">
                            <strong>${group}:</strong> ${team}
                        </div>
                    `;
                }
                html += `</div>`;
            } 
            else if (phase === "RUNDE_2_TIPP") {
                // Show semi-finalist picks
                html += `<h3 style="margin-top: 30px; margin-bottom: 15px;">🏅 Deine Halbfinale-Tipps</h3>`;
                html += `<div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin: 15px 0;">`;
                picks.forEach((team, idx) => {
                    html += `<p style="margin: 10px 0; font-size: 1.1em;"><strong>${idx + 1}.</strong> ${team}</p>`;
                });
                html += `</div>`;
            } 
            else if (phase === "FINALE_TIPP") {
                // Show champion pick prominently
                html += `<h3 style="margin-top: 30px; margin-bottom: 15px;">🏆 Dein Weltmeister-Tipp</h3>`;
                html += `
                    <div style="background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); padding: 30px; border-radius: 12px; margin: 20px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.15);">
                        <p style="color: #333; font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px;">Weltmeister</p>
                        <h2 style="color: #333; font-size: 2.5em; margin: 10px 0;">${picks}</h2>
                    </div>
                `;
            }

            html += `
                    <div style="background: #e3f2fd; padding: 20px; border-radius: 8px; margin-top: 30px; border-left: 4px solid #007bff;">
                        <p style="color: #1976d2; font-weight: bold; margin: 0;">⏳ Warte auf den Start der Simulation am Beamer...</p>
                        <p style="color: #666; font-size: 0.9em; margin: 10px 0 0 0;">Die Phase wird bald beginnen.</p>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderUI(phase) {
            const container = document.getElementById('app-container');
            clearSuccessModal(); // Clear any previous modals when phase changes
            
            if (phase === "START") {
                // wir leeren den local.storage um alle Tipps und Nicknames zu löschen
                localStorage.clear();
                container.innerHTML = "<h1>🏆 Willkommen!</h1><p>Gleich geht es los!</p>";
            } 
            else if (phase === "RUNDE_1_NICKNAME") {
                // Check if already submitted
                const savedNick = localStorage.getItem('userNickname');
                if (savedNick) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 20px;">
                            <h1>👋 Hallo <strong>${savedNick}</strong>!</h1>
                            <p style="font-size: 1.1em; color: #666;">Schön, dass du dabei bist.</p>
                            <div style="background: #e3f2fd; padding: 20px; border-radius: 8px; margin-top: 30px; border-left: 4px solid #007bff;">
                                <p style="color: #1976d2; font-weight: bold; margin: 0;">⏳ Gleich geht es los!</p>
                                <p style="color: #666; font-size: 0.9em; margin: 10px 0 0 0;">Warte auf den Start der ersten Tipprunde am Beamer...</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Phase 1: Nickname wählen
                container.innerHTML = `
                    <h1>✍️ Gib deinen Nickname ein</h1>
                    <p>Dein Nickname wird für alle deine Tipps verwendet.</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <input type="text" id="nickname" placeholder="Dein Nickname" maxlength="50">
                    <button id="nicknameButton">Nickname bestätigen</button>
                    <div id="msg"></div>
                `;
                document.getElementById('nicknameButton').addEventListener('click', submitNickname);
            }
            else if (phase === "RUNDE_1_GRUPPEN_TIPP") {
                // Phase 2: Group winners (12 dropdowns)
                // Check if already submitted
                const savedPicks = localStorage.getItem('picks_' + phase);
                if (savedPicks) {
                    return renderSubmittedView(container, phase, JSON.parse(savedPicks));
                }
                
                const savedNick = localStorage.getItem('userNickname');
                let groupsHTML = `
                    <h1>✍️ Tipprunde ist offen!</h1>
                `;
                
                if (savedNick) {
                    groupsHTML += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                }
                
                groupsHTML += `
                    <p>Tipp den Gruppensieger für jede Gruppe:</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                `;
                
                for (const [groupName, teams] of Object.entries(GROUPS)) {
                    groupsHTML += `
                        <div class="group-selector">
                            <label>${groupName}</label>
                            <select id="group_${groupName.replace(/\s/g, '_')}">
                                <option value="">-- Wähle einen Sieger --</option>
                    `;
                    teams.forEach(team => {
                        groupsHTML += `<option value="${team}">${team}</option>`;
                    });
                    groupsHTML += `
                            </select>
                        </div>
                    `;
                }
                
                groupsHTML += `
                    <button id="selectionsButton">Tipps abgeben</button>
                    <div id="msg"></div>
                `;
                
                container.innerHTML = groupsHTML;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            }
            else if (phase === "RUNDE_2_TIPP") {
                // Round 2: Select 4 semi-finalists from 12 group winners
                loadRound2UI(container);
            }
            else if (phase === "FINALE_TIPP") {
                // Finals: Select 1 champion from 4 semi-finalists
                loadFinalsUI(container);
            }
            else if (phase === "ENDE") {
                // Game Over: Show final summary
                loadFinaleSummary(container);
            }
            else if (phase.includes("TIPP")) {
                // Fallback für andere Tipp-Phasen
                container.innerHTML = "<h1>✍️ Tipprunde ist offen!</h1><p>Bitte einen Moment warten...</p>";
            }
            else if (phase.includes("SIM")) {
                container.innerHTML = "<h1>⚽ Simulation läuft!</h1><p>Die Tipps sind geschlossen. Schau auf die Leinwand für die Ergebnisse!</p>";
            }
        }

        async function loadRound2UI(container) {
            // Check if already submitted
            const savedPicks = localStorage.getItem('picks_RUNDE_2_TIPP');
            if (savedPicks) {
                return renderSubmittedView(container, 'RUNDE_2_TIPP', JSON.parse(savedPicks));
            }
            
            const savedNick = localStorage.getItem('userNickname');
            
            try {
                const res = await fetch('/api/latest-results');
                
                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Ergebnisse gefunden!</p>";
                    return;
                }
                const data = await res.json();
                
                const pairings = data.pairings;
                
                if (!pairings || pairings.length === 0) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Paarungen in der Datenbank gefunden.</p>";
                    return;
                }
                
                let html = `<h1>🏅 Viertelfinale-Tipps</h1>`;

                if (savedNick) {
                    html += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                } else {
                    html += `<p style="color: #dc3545; font-size: 1.1em; margin-bottom: 15px;">Du bist neu hier?</p>`;
                    html += `<input type="text" id="late_nickname" placeholder="Dein Nickname" maxlength="50" style="margin-bottom: 20px;">`;
                }

                html += `
                    <p>Wer gewinnt die direkten Duelle und zieht ins Halbfinale ein?</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <div class="pairings-grid">
                `;

                pairings.forEach((match, index) => {
                    html += `
                        <div class="match-card">
                            <p class="match-title">Duell ${index + 1}</p>
                            <div class="teams-container">
                                <label class="team-label">
                                    <input type="radio" name="match_${index}" class="qf-radio" value="${match.team1}">
                                    <div class="team-btn">${match.team1}</div>
                                </label>
                                
                                <div class="vs-badge">VS</div>
                                
                                <label class="team-label">
                                    <input type="radio" name="match_${index}" class="qf-radio" value="${match.team2}">
                                    <div class="team-btn">${match.team2}</div>
                                </label>
                            </div>
                        </div>
                    `;
                });

                html += `
                    </div>
                    <button id="selectionsButton" style="margin-top: 25px; width: 100%;">Tipps abgeben</button>
                    <div id="msg"></div>
                `;

                container.innerHTML = html;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Daten konnten nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function loadFinalsUI(container) {
            // Check if already submitted
            const savedPicks = localStorage.getItem('picks_FINALE_TIPP');
            if (savedPicks) {
                return renderSubmittedView(container, 'FINALE_TIPP', JSON.parse(savedPicks));
            }
            
            const savedNick = localStorage.getItem('userNickname');
            
            try {
                const res = await fetch('/api/latest-results');

                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Ergebnisse aus Runde 2 gefunden!</p>";
                    return;
                }
                const data = await res.json();                
                const teams = data.teams;
                
                // Fallback check for empty teams
                if (!teams || teams.length === 0) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>Keine Teams in der Datenbank gefunden. Bitte Simulation von Runde 2 prüfen.</p>";
                    return;
                }
                
                let html = `
                    <h1>🏆 Weltmeister-Tipp</h1>
                `;
                
                if (savedNick) {
                    html += `<p style="color: #667eea; font-size: 1.2em; margin-bottom: 20px;">👋 Willkommen, <strong>${savedNick}</strong>!</p>`;
                } else {
                    html += `<p style="color: #dc3545; font-size: 1.1em; margin-bottom: 15px;">Du bist neu hier?</p>`;
                    html += `<input type="text" id="late_nickname" placeholder="Dein Nickname" maxlength="50" style="margin-bottom: 20px;">`;
                }
                
                html += `
                    <p>Wer wird Weltmeister?</p>
                    <div class="hp-field"><input type="text" id="bot_email"></div>
                    <div class="finals-options">
                `;
                
                teams.forEach(team => {
                    html += `
                        <label>
                            <input type="radio" class="champion-radio" name="champion" value="${team}">
                            ${team}
                        </label>
                    `;
                })
                
                html += `
                    </div>
                    <button id="selectionsButton" style="margin-top: 20px;">Tipp abgeben</button>
                    <div id="msg"></div>
                `;
                
                container.innerHTML = html;
                document.getElementById('selectionsButton').addEventListener('click', submitSelections);
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Daten konnten nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function loadFinaleSummary(container) {
            const savedNick = localStorage.getItem('userNickname');
            
            if (!savedNick) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Kein Nickname gefunden!</p>";
                return;
            }
            
            try {
                const res = await fetch(`/api/user-summary?nickname=${encodeURIComponent(savedNick)}`);
                const data = await res.json();
                
                if (!res.ok) {
                    container.innerHTML = "<h1>⚠️ Fehler</h1><p>" + data.error + "</p>";
                    return;
                }
                
                let html = `
                    <div style="text-align: center; padding: 20px;">
                        <h1>🏆 Turnier vorbei!</h1>
                        <p style="font-size: 1.2em; color: #666;">Danke dass du mitgemacht hast, <strong>${data.nickname}</strong>!</p>
                        
                        <div class="score-box">
                            <p>Dein Endergebnis</p>
                            <h2>${data.total_score} Punkte</h2>
                        </div>
                        
                        <h3 style="margin-top: 40px; margin-bottom: 20px;">📋 Deine Tipps pro Runde</h3>
                `;
                
                // Round-by-round results
                data.rounds.forEach(round => {
                    const roundName = round.phase === "RUNDE_1_GRUPPEN_TIPP" ? "Runde 1: Gruppensieger" :
                                     round.phase === "RUNDE_2_TIPP" ? "Runde 2: Halbfinale" :
                                     "Finale: Weltmeister";
                    
                    html += `
                        <div class="summary-section">
                            <h4>${roundName} (${round.user_score} Punkte)</h4>
                    `;
                    
                    if (round.phase === "RUNDE_1_GRUPPEN_TIPP") {
                        // Show table of comparisons for Round 1
                        html += `
                            <table>
                                <tr>
                                    <td data-label="Gruppe">Gruppe</td>
                                    <td data-label="Dein Tipp">Dein Tipp</td>
                                    <td data-label="Ergebnis">Ergebnis</td>
                                    <td data-label="✓">✓</td>
                                </tr>
                        `;
                        round.comparisons.forEach(comp => {
                            const checkmark = comp.correct ? '✅' : '❌';
                            html += `
                                <tr>
                                    <td data-label="Gruppe">${comp.category}</td>
                                    <td data-label="Dein Tipp">${comp.user_pick}</td>
                                    <td data-label="Ergebnis">${comp.actual}</td>
                                    <td data-label="✓">${checkmark}</td>
                                </tr>
                            `;
                        });
                        html += `</table>`;
                    } 
                    else if (round.phase === "RUNDE_2_TIPP") {
                        // Show semi-finalist picks
                        html += `
                            <p><strong>Deine Tipps:</strong> ${round.comparisons.user_picks.join(', ')}</p>
                            <p><strong>Halbfinalisten:</strong> ${round.comparisons.actual_semis.join(', ')}</p>
                            <p style="color: #28a745; font-weight: bold;">✅ ${round.comparisons.correct_count} Teams richtig!</p>
                        `;
                    } 
                    else if (round.phase === "FINALE_TIPP") {
                        // Show champion pick
                        const checkmark = round.comparisons.correct ? '✅ RICHTIG!' : '❌ Leider nicht';
                        const color = round.comparisons.correct ? '#28a745' : '#dc3545';
                        html += `
                            <p><strong>Dein Favorit:</strong> ${round.comparisons.user_pick}</p>
                            <p><strong>Weltmeister:</strong> ${round.comparisons.actual_champion}</p>
                            <p style="color: ${color}; font-weight: bold; font-size: 1.1em;">${checkmark}</p>
                        `;
                    }
                    
                    html += `</div>`;
                });
                
                html += `
                        <div class="summary-section" style="border-left-color: #28a745; background: #e7f3ff;">
                            <p style="font-size: 1.1em; color: #0066cc; font-weight: bold;">🎉 Danke dass du dabei warst!</p>
                            <p>Wir sehen uns beim nächsten Tippspiel!</p>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = "<h1>⚠️ Fehler</h1><p>Zusammenfassung konnte nicht geladen werden.</p>";
                console.error(e);
            }
        }

        async function submitNickname(event) {
            const btn = event.target;
            const originalText = btn.innerHTML;
            const nick = document.getElementById('nickname').value;
            const hp = document.getElementById('bot_email').value;

            //btn blockieren
            btn.disabled = true;
            btn.style.cursor = 'wait';
            btn.innerHTML = 'Speichere...';

            if (!nick) {
                showErrorModal('⚠️ Fehler', 'Bitte gib einen Nickname ein!');
                setTimeout(clearSuccessModal, 3000);
                btn.disabled = false;
                btn.style.cursor = 'pointer';
                btn.innerHTML = originalText; 
                return;
            }


            try {
                const res = await fetch('/api/submit-nickname', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nickname: nick, email_hp: hp}),
                    credentials: 'include'
                });
                const data = await res.json();
                
                if (data.success) {
                    // Store nickname in localStorage for phase 2
                    localStorage.setItem('userNickname', nick);
                    // Kompletten View austauschen statt Modal
                    renderUI(currentPhase);
                } else {
                    showErrorModal('⚠️ Fehler', data.error);
                    setTimeout(clearSuccessModal, 3000);
                    // Button wiederherstellen
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    btn.style.cursor = 'pointer';
                }
            } catch (error) {
                showErrorModal('⚠️ Fehler', 'Netzwerkfehler beim Speichern.');
                setTimeout(clearSuccessModal, 3000);
                // Button wiederherstellen
                btn.disabled = false;
                btn.innerHTML = originalText;
                btn.style.cursor = 'pointer';
            }
        }

        async function submitSelections(event) {
            const btn = event.target;
            const originalText = btn.innerHTML;
            const hp = document.getElementById('bot_email').value;

            //polling kurz stoppen
            clearInterval(phaseInterval);

            
            //btn blockieren
            btn.disabled = true;
            btn.style.cursor = 'wait';
            btn.innerHTML = 'Speichere Tipps...';

            // Try to get nickname from localStorage first, then from late_nickname input
            let nickname = localStorage.getItem('userNickname');
            if (!nickname) {
                const lateNicknameField = document.getElementById('late_nickname');
                if (lateNicknameField) {
                    nickname = lateNicknameField.value;
                }
            }
            
            if (!nickname || nickname.trim() === '') {
                showErrorModal('⚠️ Fehler', 'Bitte gib einen Nickname ein!');
                setTimeout(clearSuccessModal, 3000);
                btn.disabled = false;
                btn.style.cursor = 'pointer';
                btn.innerHTML = originalText; 
                return;
            }
            
            let selections = null;
            
            // RUNDE_1_GRUPPEN_TIPP: Gather 12 dropdown values
            if (currentPhase === "RUNDE_1_GRUPPEN_TIPP") {
                selections = {};
                let allSelected = true;
                
                for (const groupName of Object.keys(GROUPS)) {
                    const selectId = `group_${groupName.replace(/\s/g, '_')}`;
                    const selectedTeam = document.getElementById(selectId).value;
                    
                    if (!selectedTeam) {
                        allSelected = false;
                        break;
                    }
                    selections[groupName] = selectedTeam;
                }
                
                if (!allSelected) {
                    showErrorModal('⚠️ Fehler', 'Bitte wähle einen Sieger für alle 12 Gruppen!');
                    setTimeout(clearSuccessModal, 3000);
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                    btn.innerHTML = originalText; 
                    return;
                }
            }
            
            // RUNDE_2_TIPP: Gather selected radio buttons from the matchups
            else if (currentPhase === "RUNDE_2_TIPP") {
                const checkedBoxes = document.querySelectorAll('.qf-radio:checked');
                selections = Array.from(checkedBoxes).map(box => box.value);
                
                // Wir haben 4 Duelle, also müssen exakt 4 Radio-Buttons markiert sein
                if (selections.length !== 4) {
                    showErrorModal('⚠️ Fehler', 'Bitte wähle für jedes der 4 Duelle einen Sieger aus!');
                    setTimeout(clearSuccessModal, 3000);
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                    btn.innerHTML = originalText; 
                    return;
                }
            }
            
            // FINALE_TIPP: Gather selected radio button (exactly 1)
            else if (currentPhase === "FINALE_TIPP") {
                const selectedRadio = document.querySelector('.champion-radio:checked');
                
                if (!selectedRadio) {
                    showErrorModal('⚠️ Fehler', 'Bitte wähle einen Champion!');
                    setTimeout(clearSuccessModal, 3000);
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                    btn.innerHTML = originalText; 
                    return;
                }
                
                selections = selectedRadio.value;
            }
            
            if (selections === null) {
                showErrorModal('⚠️ Fehler', 'Unbekannte Phase!');
                setTimeout(clearSuccessModal, 3000);
                btn.disabled = false;
                btn.style.cursor = 'pointer';
                btn.innerHTML = originalText; 
                return;
            }



            try {
                // If using late_nickname, save it to localStorage before fetching
                if (!localStorage.getItem('userNickname')) {
                    localStorage.setItem('userNickname', nickname);
                }

                const res = await fetch('/api/submit-selections', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nickname: nickname, selections: selections, email_hp: hp}),
                    credentials: 'include'
                });
                const data = await res.json();
                
                if (data.success) {
                    // Save picks to localStorage for this phase
                    localStorage.setItem('picks_' + currentPhase, JSON.stringify(selections));
                    // Zeige sofort die UI mit den abgegebenen Tipps an (kein Modal)
                    renderUI(currentPhase);
                } else {
                    showErrorModal('⚠️ Fehler', data.error);
                    setTimeout(clearSuccessModal, 3000);
                    // Button wiederherstellen
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    btn.style.cursor = 'pointer';
                }
            } catch (error) {
                showErrorModal('⚠️ Fehler', 'Netzwerkfehler beim Speichern.');
                setTimeout(clearSuccessModal, 3000);
                // Button wiederherstellen
                btn.disabled = false;
                btn.innerHTML = originalText;
                btn.style.cursor = 'pointer';
            } finally {
            // Polling wieder starten, egal ob Erfolg oder Fehler
            phaseInterval = setInterval(checkPhase, 3000);
            }
        }
    </script>
</body>
</html>
